<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!--
    作者：陈禹燃
    建立时间：2026-11-16 14:16
    使用模型：DeepSeek-V4.1-Flash
    功能名称：摇一摇抽今日菜谱
    功能简介：监听 devicemotion，用 accelerationIncludingGravity 计算合成加速度，超过阈值判定为摇动并随机抽取一道菜；1.5 秒冷却防重复触发，设备不支持或无数据时提供手动抽签降级方案。
  -->
  <title>摇一摇抽菜谱 · 陈禹燃</title>
  <style>
    /* ===================== 基础重置 ===================== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      background: #f6f1e9;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      color: #2c2c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px 36px;
      -webkit-tap-highlight-color: transparent;
    }

    .cyr_page {
      width: 100%;
      max-width: 420px;
    }

    /* ===================== 顶部栏 ===================== */
    .cyr_topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .cyr_back-link {
      font-size: 14px;
      color: #8a7f70;
      text-decoration: none;
    }
    .cyr_back-link:active { color: #e06a3b; }

    .cyr_page-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #3a322a;
    }

    /* ===================== 主体卡片 ===================== */
    .cyr_card {
      background: #ffffff;
      border-radius: 22px;
      padding: 28px 22px 24px;
      box-shadow: 0 18px 40px rgba(120, 80, 40, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部圆形"摇"字徽标，带轻微摇摆动画，暗示操作方式 */
    .cyr_badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(150deg, #ffb75e 0%, #e8452c 100%);
      box-shadow: 0 10px 22px rgba(232, 69, 44, 0.28);
      animation: cyr_swing 1.8s ease-in-out infinite;
    }

    @keyframes cyr_swing {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-8deg); }
      75%      { transform: rotate(8deg); }
    }

    .cyr_prompt {
      margin-top: 16px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #3a322a;
      text-align: center;
    }

    .cyr_status {
      margin-top: 8px;
      font-size: 13px;
      color: #a3968a;
      text-align: center;
      min-height: 18px;
    }

    /* ===================== 抽签结果区 ===================== */
    .cyr_dish {
      width: 100%;
      margin-top: 20px;
      min-height: 168px;
      border-radius: 18px;
      background: #f5ede2;
      border: 1px dashed #e2d3c1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }

    .cyr_dish-empty {
      font-size: 15px;
      color: #b0a396;
      letter-spacing: 1px;
    }

    /* 抽中后：渐变底 + 白字 */
    .cyr_dish.cyr_filled {
      border-style: solid;
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 14px 30px rgba(120, 80, 40, 0.22);
    }

    .cyr_dish-content {
      width: 100%;
    }

    .cyr_dish-tag {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 2px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      margin-bottom: 10px;
    }

    .cyr_dish-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    .cyr_dish-desc {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.7;
      opacity: 0.92;
    }

    /* 弹出动画：抽中时缩放 + 淡入 */
    .cyr_pop {
      animation: cyr_pop 0.45s ease-out;
    }

    @keyframes cyr_pop {
      0%   { transform: scale(0.86); opacity: 0.35; }
      60%  { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ===================== 按钮 ===================== */
    .cyr_enable-btn,
    .cyr_fallback-btn {
      margin-top: 18px;
      min-height: 44px;
      padding: 0 26px;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-family: inherit;
      color: #ffffff;
      background: linear-gradient(150deg, #ffb75e 0%, #e8452c 100%);
      box-shadow: 0 10px 22px rgba(232, 69, 44, 0.26);
      cursor: pointer;
    }
    .cyr_enable-btn:active,
    .cyr_fallback-btn:active {
      transform: translateY(1px);
      box-shadow: 0 6px 14px rgba(232, 69, 44, 0.24);
    }

    /* ===================== 不支持提示 ===================== */
    .cyr_unsupported {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: #fff7ec;
      border: 1px dashed #f0c99a;
      text-align: center;
    }

    .cyr_unsupported-text {
      font-size: 14px;
      color: #b5651d;
      letter-spacing: 0.5px;
    }

    /* ===================== 本地演示视频 ===================== */
    .cyr_video-section {
      margin-top: 24px;
    }

    .cyr_video-heading {
      margin-bottom: 10px;
      color: #3a322a;
      font-size: 16px;
      font-weight: 600;
    }

    .cyr_demo-video {
      display: block;
      width: 100%;
      height: auto;
      background: #14110e;
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(120, 80, 40, 0.18);
    }

    .cyr_video-note {
      margin-top: 9px;
      color: #8a7f70;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    /* ===================== 署名 ===================== */
    .cyr_credit {
      margin-top: 22px;
      font-size: 12px;
      color: #a3968a;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="cyr_page">

    <!-- 顶部栏 -->
    <div class="cyr_topbar">
      <a class="cyr_back-link" href="index.html">← 返回首页</a>
      <div class="cyr_page-title">摇一摇抽菜谱</div>
    </div>

    <div class="cyr_card">

      <!-- 装饰徽标 -->
      <div class="cyr_badge" aria-hidden="true">摇</div>

      <!-- 主提示 -->
      <div class="cyr_prompt" id="cyr_prompt">摇一摇手机，抽今日菜谱</div>
      <div class="cyr_status" id="cyr_status">正在检测设备传感器…</div>

      <!-- 抽签结果 -->
      <div class="cyr_dish" id="cyr_dish">
        <div class="cyr_dish-empty" id="cyr_dish_empty">今日菜谱待揭晓</div>
        <div class="cyr_dish-content" id="cyr_dish_content" hidden>
          <span class="cyr_dish-tag" id="cyr_dish_tag"></span>
          <div class="cyr_dish-name" id="cyr_dish_name"></div>
          <div class="cyr_dish-desc" id="cyr_dish_desc"></div>
        </div>
      </div>

      <!-- iOS 13+ 需用户手势授权运动传感器 -->
      <button class="cyr_enable-btn" id="cyr_enable_btn" type="button" hidden>开启摇一摇</button>

      <!-- 降级提示与手动抽取按钮 -->
      <div class="cyr_unsupported" id="cyr_unsupported" hidden>
        <div class="cyr_unsupported-text">当前设备不支持，请用手机打开</div>
        <button class="cyr_fallback-btn" id="cyr_fallback_btn" type="button">点我抽一次</button>
      </div>

    </div>

    <section class="cyr_video-section" aria-labelledby="cyr_video_heading">
      <h2 class="cyr_video-heading" id="cyr_video_heading">演示视频</h2>
      <video
        class="cyr_demo-video"
        id="cyr_sensor_video"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
        aria-label="摇一摇抽菜谱演示视频"
      >
        <source src="sensor-video.mp4" type="video/mp4">
        当前浏览器不支持视频播放，请下载 sensor-video.mp4 后观看。
      </video>
      <p class="cyr_video-note">点击播放本地视频，查看手机摇一摇抽菜谱的实际效果。</p>
    </section>

    <div class="cyr_credit">陈禹燃 · 学号 0325</div>

  </div>

  <script>
    /*
      作者：陈禹燃
      建立时间：2026-11-16 14:16
      功能：摇一摇抽菜谱的手势与降级逻辑

      为什么必须做降级（摘要）：
      devicemotion 依赖设备硬件与浏览器权限，桌面浏览器、部分安卓机型、
      未授权或处于非 HTTPS 环境时都可能没有事件或数据为 null；
      iOS 13+ 还必须由用户手势主动申请权限。若不降级，用户会面对一个
      "怎么摇都没反应"的死页面，因此必须提供手动抽取入口保证功能可用。
    */
    (function () {
      "use strict";

      /* ===================== 常量 ===================== */
      var cyr_SHAKE_THRESHOLD = 18;    // 合成加速度阈值（m/s²，静止时约为 9.8）
      var cyr_COOLDOWN_MS = 1500;      // 摇动触发后的冷却时间（ms）
      var cyr_DATA_TIMEOUT = 2500;     // 监听开始后多久没有数据就判定为不支持（ms）

      /* ===================== 菜谱数据 ===================== */
      var cyr_DISHES = [
        { name: "麻辣香锅",   tag: "川味",   desc: "牛油底料现炒，麻辣鲜香，配土豆片和宽粉最过瘾。", bg: "linear-gradient(150deg, #ffb75e 0%, #e8452c 100%)" },
        { name: "番茄牛腩面", tag: "主食",   desc: "牛腩慢炖三小时，汤头酸甜浓厚，面条筋道挂汁。",   bg: "linear-gradient(150deg, #f9d976 0%, #d2691e 100%)" },
        { name: "蒜蓉小龙虾", tag: "夏夜",   desc: "现捞现做，蒜香浓郁不呛口，虾肉弹牙带甜。",       bg: "linear-gradient(150deg, #ff9a8b 0%, #d63b6a 100%)" },
        { name: "抹茶千层",   tag: "甜品",   desc: "二十层薄饼夹抹茶奶油，入口绵密，回甘清苦。",     bg: "linear-gradient(150deg, #a8e063 0%, #2b8a5b 100%)" },
        { name: "黑椒牛排",   tag: "西餐",   desc: "七分熟锁住肉汁，黑椒微辣，配烤时蔬解腻。",       bg: "linear-gradient(150deg, #8d6e63 0%, #3e2723 100%)" },
        { name: "酸菜鱼",     tag: "开胃",   desc: "鱼片嫩滑无刺，酸菜爽脆，汤底酸香带一点回辣。",   bg: "linear-gradient(150deg, #9fd3c7 0%, #2c7a7b 100%)" },
        { name: "照烧鸡腿饭", tag: "下饭",   desc: "酱汁浓稠甜咸，鸡腿外焦里嫩，配米饭一大碗。",     bg: "linear-gradient(150deg, #f6c26b 0%, #b5541b 100%)" },
        { name: "冬阴功汤",   tag: "暖胃",   desc: "酸辣带椰香，虾与菌菇同煮，喝一口全身都暖。",     bg: "linear-gradient(150deg, #ff8a80 0%, #b71c1c 100%)" }
      ];

      /* ===================== DOM ===================== */
      var cyr_statusEl = document.getElementById("cyr_status");
      var cyr_dishEl = document.getElementById("cyr_dish");
      var cyr_dishEmptyEl = document.getElementById("cyr_dish_empty");
      var cyr_dishContentEl = document.getElementById("cyr_dish_content");
      var cyr_dishTagEl = document.getElementById("cyr_dish_tag");
      var cyr_dishNameEl = document.getElementById("cyr_dish_name");
      var cyr_dishDescEl = document.getElementById("cyr_dish_desc");
      var cyr_enableBtn = document.getElementById("cyr_enable_btn");
      var cyr_unsupportedEl = document.getElementById("cyr_unsupported");
      var cyr_fallbackBtn = document.getElementById("cyr_fallback_btn");

      /* ===================== 状态 ===================== */
      var cyr_lastShakeAt = 0;        // 上次有效摇动的时间戳（冷却用）
      var cyr_lastIndex = -1;         // 上一次抽到的菜，避免连续重复
      var cyr_isListening = false;    // 是否已经绑定 devicemotion
      var cyr_hasData = false;        // 是否收到过有效传感器数据
      var cyr_dataTimer = null;       // 无数据判定的定时器

      /**
       * 功能：更新状态提示文字
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:16
       * @param {string} cyr_text - 提示文案
       * @returns {void}
       */
      function cyr_setStatus(cyr_text) {
        cyr_statusEl.textContent = cyr_text;
      }

      /**
       * 功能：随机抽一道菜（尽量不与上一次重复）并渲染到结果区，同时播放弹出动画
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:16
       * @returns {void}
       */
      function cyr_drawDish() {
        var cyr_index = Math.floor(Math.random() * cyr_DISHES.length);

        // 只有一道菜时不处理；否则避免连续抽到同一道
        if (cyr_index === cyr_lastIndex && cyr_DISHES.length > 1) {
          cyr_index = (cyr_index + 1) % cyr_DISHES.length;
        }
        cyr_lastIndex = cyr_index;

        var cyr_dish = cyr_DISHES[cyr_index];

        // 写入内容
        cyr_dishTagEl.textContent = cyr_dish.tag;
        cyr_dishNameEl.textContent = cyr_dish.name;
        cyr_dishDescEl.textContent = cyr_dish.desc;
        cyr_dishEl.style.background = cyr_dish.bg;

        // 切换展示状态
        cyr_dishEmptyEl.hidden = true;
        cyr_dishContentEl.hidden = false;
        cyr_dishEl.classList.add("cyr_filled");

        // 重播弹出动画：先移除类、强制回流，再添加
        cyr_dishEl.classList.remove("cyr_pop");
        void cyr_dishEl.offsetWidth;
        cyr_dishEl.classList.add("cyr_pop");

        cyr_setStatus("今日推荐已揭晓，想换一道就再摇一次");

        // 抽中时给一次短震动反馈（不支持该 API 的设备会静默跳过）
        cyr_vibrate();
      }

      /**
       * 功能：调用 Vibration API 触发一次短震动，作为"摇一摇"的触觉反馈
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:16
       * @returns {void}
       */
      function cyr_vibrate() {
        // iOS Safari 没有 navigator.vibrate，只能静默跳过
        if (typeof navigator.vibrate === "function") {
          navigator.vibrate(35);
        }
      }

      /**
       * 功能：devicemotion 回调，用 accelerationIncludingGravity 计算合成加速度并判定摇动
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:16
       * @param {DeviceMotionEvent} cyr_event - 设备运动事件
       * @returns {void}
       */
      function cyr_onDeviceMotion(cyr_event) {
        var cyr_acc = cyr_event.accelerationIncludingGravity;

        // 部分浏览器/设备会给出 null，视为"没有数据"
        if (!cyr_acc || cyr_acc.x === null || cyr_acc.y === null || cyr_acc.z === null) {
          return;
        }

        // 首次拿到有效数据：标记并取消"不支持"的判定
        if (!cyr_hasData) {
          cyr_hasData = true;
          if (cyr_dataTimer) {
            clearTimeout(cyr_dataTimer);
            cyr_dataTimer = null;
          }
          cyr_unsupportedEl.hidden = true;
          cyr_enableBtn.hidden = true;
          cyr_setStatus("轻摇手机即可抽取");
        }

        // 合成加速度：三轴平方和开方（静止时约为 9.8）
        var cyr_sum = Math.sqrt(
          cyr_acc.x * cyr_acc.x +
          cyr_acc.y * cyr_acc.y +
          cyr_acc.z * cyr_acc.z
        );

        if (cyr_sum < cyr_SHAKE_THRESHOLD) {
          return;
        }

        // 1.5 秒冷却：一次摇动会产生大量事件，这段时间内只算一次
        var cyr_now = Date.now();
        if (cyr_now - cyr_lastShakeAt < cyr_COOLDOWN_MS) {
          return;
        }
        cyr_lastShakeAt = cyr_now;

        cyr_drawDish();
      }

      /**
       * 功能：开始监听 devicemotion，并启动"无数据"超时判定
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:16
       * @returns {void}
       */
      function cyr_startListening() {
        if (cyr_isListening) {
          return;
        }
        cyr_isListening = true;

        window.addEventListener("devicemotion", cyr_onDeviceMotion, { passive: true });
        cyr_setStatus("轻摇手机即可抽取");

        // 一段时间内没有任何有效数据，就认为设备不支持，展示降级方案
        cyr_dataTimer = setTimeout(function () {
          if (!cyr_hasData) {
            cyr_showUnsupported();
          }
        }, cyr_DATA_TIMEOUT);
      }

      /**
       * 功能：展示"当前设备不支持"提示与"点我抽一次"降级按钮
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:16
       * @returns {void}
       */
      function cyr_showUnsupported() {
        cyr_unsupportedEl.hidden = false;
        cyr_fallbackBtn.hidden = false;
        cyr_setStatus("可点击下方按钮手动抽取");
      }

      /**
       * 功能：iOS 13+ 申请运动传感器权限，授权成功后开始监听
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:16
       * @returns {void}
       */
      function cyr_requestPermission() {
        window.DeviceMotionEvent.requestPermission()
          .then(function (cyr_state) {
            if (cyr_state === "granted") {
              cyr_enableBtn.hidden = true;
              cyr_startListening();
            } else {
              cyr_showUnsupported();
            }
          })
          .catch(function () {
            cyr_showUnsupported();
          });
      }

      /* ===================== 初始化与事件绑定 ===================== */

      // 降级按钮：手动抽一次（不受传感器冷却限制）
      cyr_fallbackBtn.addEventListener("click", function () {
        cyr_drawDish();
      });

      // 权限按钮：iOS 13+ 需要用户手势才能申请
      cyr_enableBtn.addEventListener("click", function () {
        cyr_requestPermission();
      });

      if (!("DeviceMotionEvent" in window)) {
        // 浏览器根本没有该事件（桌面浏览器常见）
        cyr_showUnsupported();
        cyr_setStatus("当前浏览器没有 devicemotion 事件");
      } else if (typeof window.DeviceMotionEvent.requestPermission === "function") {
        // iOS 13+：必须先由用户点击授权，不能直接监听
        cyr_enableBtn.hidden = false;
        cyr_setStatus("iPhone 需先允许访问运动传感器");
      } else {
        cyr_startListening();
      }
    })();
  </script>
</body>
</html>
