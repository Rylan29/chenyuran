<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS内部对象</title>
</head>
<body>



    <script>
//Math对象
    console.log(Math.floor(1.9));//向下取整
    console.log(Math.round(1.9));//四舍五入
    console.log(Math.random() * 101);//随机数[0,100]整数
    // //随机数[min,max]整数
    // function getRandomInt(min,max){
    //     return Math.floor(Math.random()*(max-min+1)+min);
    // }
    //Date对象
    var date = new Date();
    console.log(date.getFullYear());//获取年份
    console.log(date.getMonth()+1);//获取月份，注意月份是从0开始的，所以要加1
    console.log(date.getDate());//获取日期
    console.log(date.getDay());//获取星期几，0是星期天，1是星期一，依次类推
    console.log(date.getHours()+":"+date.getMinutes()+":"+date.getSeconds());//获取小时、分钟、秒
    console.log(date.getTime());//获取时间戳
    //数组
    var arr = [1,2,3,4,5,6,'seven','eight',9,10];
    var arr1 = new Array(1,2,3,4,5,6,'seven','eight',9,10);
    var arr2 = new Array(5);
    console.log(arr2);
    //数组里面只有一个元素5 ES6之后出现的语法
    var arr3 = Array.of(5);
    </script>
</body>
</html>
