<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucide SVG 图标演示</title>
  <!--
    模块二 · 任务 i3：Lucide SVG 图标演示页
    技术方案：Lucide v1.61.0（SVG 图标，UMD 版），资源已本地化，离线可用
    本地资源：cdn/lucide/lucide.min.js；页面加载后调用 lucide.createIcons()
             将 <i data-lucide="..."> 占位元素替换为内联 <svg>
    命名约定：自写类名 / id 一律以 cyr_ 开头；data-lucide 为第三方库专用属性，保持原样不改
    编写日期：2026-10-22
  -->
  <style>
    /* 设计变量：与 iconfont-1.html 保持同一视觉体系 */
    :root {
      --cyr_color-bg: #fff9c4;
      --cyr_color-card: #ffffff;
      --cyr_color-icon: #2196f3;
      --cyr_color-text: #4e342e;
      --cyr_color-text-muted: #8d7b6b;
      --cyr_color-divider: rgba(78, 52, 46, 0.12);
    }

    /* 基础重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--cyr_color-bg);
      color: var(--cyr_color-text);
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 页首：标题与返回首页链接 */
    .cyr_page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--cyr_color-divider);
    }

    .cyr_page-title {
      font-size: 22px;
    }

    .cyr_back-link {
      color: var(--cyr_color-icon);
      font-weight: 600;
      text-decoration: none;
    }

    .cyr_back-link:hover {
      text-decoration: underline;
    }

    /* 图标网格：卡片自适应排列（CSS Grid），与字体图标页同构，便于对比两种技术 */
    .cyr_icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    .cyr_icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 12px;
      background-color: var(--cyr_color-card);
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(78, 52, 46, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cyr_icon-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(78, 52, 46, 0.14);
    }

    /* SVG 图标本体：宽高决定图标大小；Lucide 用 stroke="currentColor" 绘制，
       color 变化会直接反映到描边色（SVG 图标的技术特点）。
       createIcons() 会把占位 <i> 的 class 合并到生成的 <svg> 上。 */
    .cyr_icon {
      width: 32px;
      height: 32px;
      color: var(--cyr_color-icon);
    }

    .cyr_icon-name {
      font-size: 13px;
      color: var(--cyr_color-text-muted);
      text-align: center;
      overflow-wrap: anywhere;
    }

    /* 页脚：技术说明 */
    .cyr_page-footer {
      padding: 16px 24px 32px;
      font-size: 13px;
      color: var(--cyr_color-text-muted);
      text-align: center;
    }

    /* 窄屏适配 */
    @media (max-width: 480px) {
      .cyr_page-header {
        padding: 12px 16px;
      }

      .cyr_page-title {
        font-size: 18px;
      }

      .cyr_icon-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="cyr_page-header">
    <h1 class="cyr_page-title">Lucide SVG 图标演示</h1>
    <a class="cyr_back-link" href="index.html">← 返回首页</a>
  </header>

  <main>
    <section class="cyr_icon-grid" aria-label="Lucide 图标列表">
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="house" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">house · 首页</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="user" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">user · 用户</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="search" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">search · 搜索</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="settings" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">settings · 设置</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="heart" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">heart · 喜欢</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="star" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">star · 收藏</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="bell" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">bell · 通知</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="mail" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">mail · 邮件</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="camera" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">camera · 相机</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="download" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">download · 下载</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="trash-2" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">trash-2 · 删除</figcaption>
      </figure>
      <figure class="cyr_icon-card">
        <i class="cyr_icon" data-lucide="music" aria-hidden="true"></i>
        <figcaption class="cyr_icon-name">music · 音乐</figcaption>
      </figure>
    </section>
  </main>

  <footer class="cyr_page-footer">
    技术方案：Lucide v1.61.0 SVG 图标 —— 脚本把 data-lucide 占位元素替换为内联 &lt;svg&gt;，矢量缩放不失真，描边继承 currentColor，断网可用。
  </footer>

  <script src="cdn/lucide/lucide.min.js"></script>
  <script>
    // 把页面上所有 data-lucide 占位元素替换为对应的内联 SVG
    lucide.createIcons();
  </script>
</body>
</html>
