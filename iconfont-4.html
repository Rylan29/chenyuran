<!DOCTYPE html>
<!--
  iconfont-4.html — 移动端底部导航演示（Lucide SVG 图标方案）
  依赖：cdn/lucide/lucide.min.js（本地化，离线可用）
  资源版本：Lucide 1.61.0（unpkg UMD）
  说明：布局规格与 iconfont-3.html 一致，便于对比字体图标与 SVG 两种实现；
        「消息」数字徽章，「购物车」红点
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>底部导航演示 · SVG 图标</title>
  <style>
    /* ---------------- 变量 ---------------- */
    :root {
      --cyr_color-bg: #fff9c4;
      --cyr_color-card: #ffffff;
      --cyr_color-active: #2196f3;
      --cyr_color-tab-inactive: #8d7b6b;
      --cyr_color-badge: #f44336;
      --cyr_color-text: #4e342e;
      --cyr_color-text-muted: #8d7b6b;
      --cyr_color-divider: rgba(78, 52, 46, 0.12);
      --cyr_tabbar-height: 56px;
    }

    /* ---------------- 基础 ---------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--cyr_color-bg);
      color: var(--cyr_color-text);
    }

    /* ---------------- 顶部标题栏 ---------------- */
    .cyr_page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--cyr_color-divider);
      background-color: var(--cyr_color-card);
    }

    .cyr_page-title {
      font-size: 16px;
      font-weight: 600;
    }

    .cyr_back-link {
      color: var(--cyr_color-text);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .cyr_back-link:hover {
      color: var(--cyr_color-active);
      text-decoration: underline;
    }

    .cyr_back-link:focus-visible,
    .cyr_tabbar__item:focus-visible {
      outline: 3px solid rgba(33, 150, 243, 0.4);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---------------- 内容占位区 ---------------- */
    /* 底部 padding 预留出固定导航高度 + 安全区，保证最后一张卡片不被遮挡 */
    .cyr_content {
      padding: 16px 16px calc(var(--cyr_tabbar-height) + env(safe-area-inset-bottom, 0px) + 16px);
    }

    .cyr_card {
      background-color: var(--cyr_color-card);
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 1px 4px rgba(78, 52, 46, 0.08);
    }

    /* ---------------- 底部导航 ---------------- */
    .cyr_tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      /* 安全区：高度随底部圆角条扩展，内容仍为 56px */
      height: calc(var(--cyr_tabbar-height) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background-color: var(--cyr_color-card);
      border-top: 1px solid var(--cyr_color-divider);
    }

    .cyr_tabbar__item {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--cyr_color-tab-inactive);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cyr_tabbar__item--active {
      color: var(--cyr_color-active);
    }

    /* 图标外层容器：角标的定位参照 */
    .cyr_tabbar__icon-wrap {
      position: relative;
      line-height: 1;
    }

    /* Lucide 渲染出的内联 SVG：尺寸用 width/height，描边色随 currentColor 继承 */
    .cyr_icon {
      display: block;
      width: 22px;
      height: 22px;
    }

    .cyr_tabbar__label {
      font-size: 11px;
    }

    /* ---------------- 角标 ---------------- */
    .cyr_badge {
      position: absolute;
      top: -6px;
      right: -12px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background-color: var(--cyr_color-badge);
      color: #ffffff;
      font-size: 10px;
      line-height: 16px;
      text-align: center;
      font-style: normal;
    }

    .cyr_badge--dot {
      top: -2px;
      right: -6px;
      min-width: 8px;
      width: 8px;
      height: 8px;
      padding: 0;
    }
  </style>
</head>
<body>
  <header class="cyr_page-header">
    <h1 class="cyr_page-title">底部导航演示 · SVG 图标</h1>
    <a class="cyr_back-link" href="index.html">← 返回首页</a>
  </header>

  <!-- 内容占位：4 张卡片保证可滚动，用于验证固定导航 -->
  <main class="cyr_content">
    <section class="cyr_card">占位卡片 1 —— 本页与 iconfont-3 布局完全一致，但图标由 Lucide 以内联 SVG 方式渲染。</section>
    <section class="cyr_card">占位卡片 2 —— 「消息」图标右上角是数字徽章（8），SVG 的描边色随 currentColor 继承激活态颜色。</section>
    <section class="cyr_card">占位卡片 3 —— 「购物车」图标右上角是 8px 红点，用法与字体图标版一致。</section>
    <section class="cyr_card">占位卡片 4 —— F12 检查 Elements：每个图标都是 <code>&lt;svg&gt;</code> 标签，而非字体字符。</section>
  </main>

  <!-- 固定底部导航：4 项 flex 等宽 -->
  <nav class="cyr_tabbar" aria-label="底部导航">
    <a class="cyr_tabbar__item cyr_tabbar__item--active" href="#" aria-current="page">
      <span class="cyr_tabbar__icon-wrap">
        <i class="cyr_icon" data-lucide="house" aria-hidden="true"></i>
      </span>
      <span class="cyr_tabbar__label">首页</span>
    </a>
    <a class="cyr_tabbar__item" href="#">
      <span class="cyr_tabbar__icon-wrap">
        <i class="cyr_icon" data-lucide="message-circle" aria-hidden="true"></i>
        <span class="cyr_badge">8</span>
      </span>
      <span class="cyr_tabbar__label">消息</span>
    </a>
    <a class="cyr_tabbar__item" href="#">
      <span class="cyr_tabbar__icon-wrap">
        <i class="cyr_icon" data-lucide="shopping-cart" aria-hidden="true"></i>
        <span class="cyr_badge cyr_badge--dot" aria-hidden="true"></span>
      </span>
      <span class="cyr_tabbar__label">购物车</span>
    </a>
    <a class="cyr_tabbar__item" href="#">
      <span class="cyr_tabbar__icon-wrap">
        <i class="cyr_icon" data-lucide="user" aria-hidden="true"></i>
      </span>
      <span class="cyr_tabbar__label">我的</span>
    </a>
  </nav>

  <!-- 本地 SVG 图标库：占位 <i data-lucide> 渲染为内联 <svg> -->
  <script src="cdn/lucide/lucide.min.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
