<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!--
    作者：陈禹燃
    建立时间：2026-11-16 14:03
    使用模型：DeepSeek-V4.1-Flash
    功能名称：移动端图片查看器（双指缩放 / 单指拖动 / 双击缩放）
    功能简介：图片放在 overflow:hidden 且 touch-action:none 的容器中，支持双指以两指中点为基准做 1~4 倍缩放、放大后单指拖动并在松手时夹取边界、双击在 1x 与 2x 之间带 0.25s 过渡切换。
  -->
  <title>图片查看器 · 陈禹燃</title>
  <style>
    /* ===================== 基础重置 ===================== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      background: #f6f1e9;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      color: #2c2c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px 40px;
      -webkit-tap-highlight-color: transparent;
    }

    .cyr_page {
      width: 100%;
      max-width: 420px;
    }

    /* ===================== 顶部栏 ===================== */
    .cyr_topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .cyr_back-link {
      font-size: 14px;
      color: #8a7f70;
      text-decoration: none;
    }
    .cyr_back-link:active { color: #e06a3b; }

    .cyr_page-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #3a322a;
    }

    /* ===================== 图片容器 =====================
       overflow: hidden       —— 放大后的图片被裁切在容器内
       touch-action: none     —— 禁止浏览器原生滚动/缩放，手势全部交给 JS
       user-select: none      —— 拖动时不被选中成蓝色文本/图片 */
    .cyr_viewer {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      max-height: 70vh;
      border-radius: 20px;
      overflow: hidden;
      background: #14110e;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-shadow: 0 18px 40px rgba(120, 80, 40, 0.22);
      cursor: grab;
    }
    .cyr_viewer:active { cursor: grabbing; }

    /* 图片本体：只通过 transform 改变位置与大小，不触发重排 */
    .cyr_image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 变换原点固定在左上角，便于用 translate + scale 直接推导缩放基准 */
      transform-origin: 0 0;
      will-change: transform;
      /* 触摸事件统一由容器接收，避免图片自身的原生拖拽干扰手势 */
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 仅在双击缩放时启用 0.25s 过渡；手势过程中必须瞬时跟手 */
    .cyr_image.cyr_animating {
      transition: transform 0.25s ease;
    }

    /* ===================== 打开页面的提示 ===================== */
    .cyr_tip {
      position: fixed;
      left: 50%;
      top: 18px;
      transform: translate(-50%, -10px);
      z-index: 10;
      padding: 10px 18px;
      font-size: 13px;
      letter-spacing: 1px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 999px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    .cyr_tip.cyr_show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ===================== 本地演示视频 ===================== */
    .cyr_video-section {
      margin-top: 24px;
    }
    .cyr_video-heading {
      margin-bottom: 10px;
      color: #3a322a;
      font-size: 16px;
      font-weight: 600;
    }
    .cyr_demo-video {
      display: block;
      width: 100%;
      height: auto;
      background: #14110e;
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(120, 80, 40, 0.18);
    }
    .cyr_video-note {
      margin-top: 9px;
      color: #8a7f70;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }
  </style>
</head>

  </div>

  <script>
    /*
      作者：陈禹燃
      建立时间：2026-11-16 14:03
      功能：移动端图片查看器的手势逻辑（双指缩放 / 单指拖动 / 双击缩放）
    */
    (function () {
      "use strict";

      /* ===================== 常量 ===================== */
      var cyr_MIN_SCALE = 1;              // 最小缩放倍数
      var cyr_MAX_SCALE = 4;              // 最大缩放倍数
      var cyr_DOUBLE_TAP_SCALE = 2;       // 双击放大到的倍数
      var cyr_DOUBLE_TAP_DELAY = 300;     // 双击的最大时间间隔（ms）
      var cyr_DOUBLE_TAP_RANGE = 30;      // 两次轻点之间的位置容差（px）
      var cyr_TAP_MOVE = 10;              // 位移超过该值就不算"轻点"

      /* ===================== DOM ===================== */
      var cyr_viewer = document.getElementById("cyr_viewer");
      var cyr_image = document.getElementById("cyr_image");
      var cyr_tip = document.getElementById("cyr_tip");

      /* ===================== 状态 ===================== */
      var cyr_scale = 1;                  // 当前缩放倍数
      var cyr_tx = 0;                     // 当前横向位移（px）
      var cyr_ty = 0;                     // 当前纵向位移（px）
      var cyr_rect = null;                // 手势开始时的容器位置与尺寸（局部坐标基准）

      var cyr_mode = "none";              // 手势模式：none / pan / pinch
      var cyr_moved = false;              // 本次单指手势是否发生过拖动
      var cyr_hadMultiTouch = false;      // 本次手势是否出现过双指（出现过就不判双击）

      var cyr_panStartX = 0;              // 单指拖动起点
      var cyr_panStartY = 0;
      var cyr_panBaseTx = 0;              // 拖动开始时的位移基准
      var cyr_panBaseTy = 0;

      var cyr_lastDist = 0;               // 上一帧两指距离（用于按比例缩放）
      var cyr_lastMidX = 0;               // 上一帧两指中点（容器局部坐标）
      var cyr_lastMidY = 0;

      var cyr_lastTapAt = 0;              // 上一次轻点的时间戳
      var cyr_lastTapX = 0;
      var cyr_lastTapY = 0;

      /**
       * 功能：计算两根手指之间的直线距离
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {Touch} cyr_t1 - 第一根手指
       * @param {Touch} cyr_t2 - 第二根手指
       * @returns {number} 两指距离（px）
       */
      function cyr_distance(cyr_t1, cyr_t2) {
        var cyr_dx = cyr_t1.clientX - cyr_t2.clientX;
        var cyr_dy = cyr_t1.clientY - cyr_t2.clientY;
        return Math.sqrt(cyr_dx * cyr_dx + cyr_dy * cyr_dy);
      }

      /**
       * 功能：计算两指中点，并换算成相对容器左上角的局部坐标
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {Touch} cyr_t1 - 第一根手指
       * @param {Touch} cyr_t2 - 第二根手指
       * @returns {{x: number, y: number}} 中点局部坐标
       */
      function cyr_midpoint(cyr_t1, cyr_t2) {
        return {
          x: (cyr_t1.clientX + cyr_t2.clientX) / 2 - cyr_rect.left,
          y: (cyr_t1.clientY + cyr_t2.clientY) / 2 - cyr_rect.top
        };
      }

      /**
       * 功能：把缩放倍数限制在 1 ~ 4 之间
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {number} cyr_value - 待限制的倍数
       * @returns {number} 限制后的倍数
       */
      function cyr_clampScale(cyr_value) {
        return Math.min(cyr_MAX_SCALE, Math.max(cyr_MIN_SCALE, cyr_value));
      }

      /**
       * 功能：把位移限制在边界内，保证图片始终盖满容器、不会拖出空白
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @returns {void}
       */
      function cyr_clampTranslate() {
        // 放大后允许的位移范围是 [容器尺寸×(1-倍数), 0]
        // 未放大时范围为 0，即位移必须归零
        var cyr_minX = cyr_rect.width * (1 - cyr_scale);
        var cyr_minY = cyr_rect.height * (1 - cyr_scale);
        cyr_tx = Math.min(0, Math.max(cyr_minX, cyr_tx));
        cyr_ty = Math.min(0, Math.max(cyr_minY, cyr_ty));
      }

      /**
       * 功能：把当前倍数与位移写入 transform，并按需开关 0.25s 过渡
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {boolean} cyr_animate - true 表示双击缩放（带过渡），false 表示手势跟手（无过渡）
       * @returns {void}
       */
      function cyr_render(cyr_animate) {
        if (cyr_animate) {
          cyr_image.classList.add("cyr_animating");
        } else {
          cyr_image.classList.remove("cyr_animating");
        }
        // 顺序固定为 先平移 后缩放，与 transform-origin: 0 0 及下面的换算公式严格对应
        cyr_image.style.transform =
          "translate3d(" + cyr_tx + "px, " + cyr_ty + "px, 0) scale(" + cyr_scale + ")";
      }

      /**
       * 功能：开始双指手势，记录两指初始距离与初始中点
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {TouchList} cyr_touches - 当前触摸点列表
       * @returns {void}
       */
      function cyr_beginPinch(cyr_touches) {
        cyr_mode = "pinch";
        cyr_hadMultiTouch = true;
        cyr_lastTapAt = 0;                     // 出现过双指，清空双击计时
        cyr_image.classList.remove("cyr_animating");

        cyr_lastDist = cyr_distance(cyr_touches[0], cyr_touches[1]);
        var cyr_mid = cyr_midpoint(cyr_touches[0], cyr_touches[1]);
        cyr_lastMidX = cyr_mid.x;
        cyr_lastMidY = cyr_mid.y;
        // 注意：这里不改变 scale / tx / ty，所以第二根手指落下的瞬间画面不会跳动
      }

      /**
       * 功能：开始（或重置）单指拖动基准
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {Touch} cyr_touch - 当前按下的手指
       * @returns {void}
       */
      function cyr_beginPan(cyr_touch) {
        cyr_mode = "pan";
        cyr_moved = false;
        cyr_panStartX = cyr_touch.clientX;
        cyr_panStartY = cyr_touch.clientY;
        cyr_panBaseTx = cyr_tx;
        cyr_panBaseTy = cyr_ty;
        cyr_image.classList.remove("cyr_animating");
      }

      /**
       * 功能：双指移动时按两指距离比例缩放，并以两指中点为基准保持内容不偏移
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {Touch} cyr_t1 - 第一根手指
       * @param {Touch} cyr_t2 - 第二根手指
       * @returns {void}
       */
      function cyr_onPinchMove(cyr_t1, cyr_t2) {
        var cyr_dist = cyr_distance(cyr_t1, cyr_t2);
        if (cyr_lastDist <= 0) {
          cyr_lastDist = cyr_dist;
          return;
        }

        // 按与上一帧的距离比例做增量缩放，避免从手势起点累乘造成抖动
        var cyr_ratio = cyr_dist / cyr_lastDist;
        var cyr_nextScale = cyr_clampScale(cyr_scale * cyr_ratio);
        var cyr_mid = cyr_midpoint(cyr_t1, cyr_t2);

        /*
          以两指中点为基准的推导（transform-origin: 0 0，先平移后缩放）：
          上一帧中点下的内容坐标 c = (lastMid - t) / scale
          为了让这块内容在当前帧仍落在新中点下：
            t' = mid - c × scale' = mid - (lastMid - t) × (scale' / scale)
          这样缩放与两指整体平移可以同时被正确表达，画面不会"跳"。
        */
        var cyr_scaleRatio = cyr_nextScale / cyr_scale;
        cyr_tx = cyr_mid.x - (cyr_lastMidX - cyr_tx) * cyr_scaleRatio;
        cyr_ty = cyr_mid.y - (cyr_lastMidY - cyr_ty) * cyr_scaleRatio;
        cyr_scale = cyr_nextScale;

        // 记录本帧数据，供下一帧做增量计算
        cyr_lastDist = cyr_dist;
        cyr_lastMidX = cyr_mid.x;
        cyr_lastMidY = cyr_mid.y;

        // 缩放过程中也实时夹取边界，避免放大后被推离画面
        cyr_clampTranslate();
        cyr_render(false);
      }

      /**
       * 功能：touchstart —— 记录初始状态（单指拖动基准 / 双指距离与中点）
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {TouchEvent} cyr_event - 触摸事件
       * @returns {void}
       */
      function cyr_onTouchStart(cyr_event) {
        // 每次手势开始都重新测量容器，兼容页面滚动、横竖屏切换后的位置变化
        cyr_rect = cyr_viewer.getBoundingClientRect();

        if (cyr_event.touches.length >= 2) {
          cyr_beginPinch(cyr_event.touches);
          return;
        }

        if (cyr_event.touches.length === 1) {
          // 从双指过渡到单指时保持"出现过双指"的标记，避免被识别成双击
          if (cyr_mode !== "pinch") {
            cyr_hadMultiTouch = false;
          }
          cyr_beginPan(cyr_event.touches[0]);
        }
      }

      /**
       * 功能：touchmove —— 双指缩放；单指且已放大时拖动图片
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {TouchEvent} cyr_event - 触摸事件
       * @returns {void}
       */
      function cyr_onTouchMove(cyr_event) {
        // 双指：缩放 + 跟随中点平移
        if (cyr_event.touches.length >= 2) {
          cyr_event.preventDefault();
          cyr_onPinchMove(cyr_event.touches[0], cyr_event.touches[1]);
          return;
        }

        // 单指：只有放大后才允许拖动
        if (cyr_event.touches.length === 1 && cyr_mode === "pan") {
          var cyr_touch = cyr_event.touches[0];
          var cyr_dx = cyr_touch.clientX - cyr_panStartX;
          var cyr_dy = cyr_touch.clientY - cyr_panStartY;

          if (Math.abs(cyr_dx) > cyr_TAP_MOVE || Math.abs(cyr_dy) > cyr_TAP_MOVE) {
            cyr_moved = true;
          }

          if (cyr_scale > cyr_MIN_SCALE) {
            cyr_event.preventDefault();
            cyr_tx = cyr_panBaseTx + cyr_dx;
            cyr_ty = cyr_panBaseTy + cyr_dy;
            cyr_clampTranslate();
            cyr_render(false);
          }
        }
      }

      /**
       * 功能：双击处理 —— 1x 与 2x 之间切换，以点击位置为缩放基准并带 0.25s 过渡
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {Touch} cyr_touch - 双击时抬起的手指
       * @returns {void}
       */
      function cyr_handleDoubleTap(cyr_touch) {
        var cyr_target = cyr_scale > cyr_MIN_SCALE ? cyr_MIN_SCALE : cyr_DOUBLE_TAP_SCALE;

        if (cyr_target === cyr_MIN_SCALE) {
          // 回到 1x：位移直接归零，避免残留偏移
          cyr_scale = cyr_MIN_SCALE;
          cyr_tx = 0;
          cyr_ty = 0;
        } else {
          // 放大到 2x：保持双击点下的内容不动，同样使用基准点公式
          cyr_rect = cyr_viewer.getBoundingClientRect();
          var cyr_px = cyr_touch.clientX - cyr_rect.left;
          var cyr_py = cyr_touch.clientY - cyr_rect.top;
          var cyr_ratio = cyr_target / cyr_scale;

          cyr_tx = cyr_px - (cyr_px - cyr_tx) * cyr_ratio;
          cyr_ty = cyr_py - (cyr_py - cyr_ty) * cyr_ratio;
          cyr_scale = cyr_target;
          cyr_clampTranslate();
        }

        cyr_render(true);
      }

      /**
       * 功能：touchend —— 处理手势收尾、边界夹取与双击判定
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @param {TouchEvent} cyr_event - 触摸事件
       * @returns {void}
       */
      function cyr_onTouchEnd(cyr_event) {
        // 双指抬起一根：立刻以剩下那根手指重建拖动基准，防止画面突跳
        if (cyr_event.touches.length === 1) {
          cyr_beginPan(cyr_event.touches[0]);
          cyr_moved = true;          // 双指之后的单指移动不应触发双击
          cyr_hadMultiTouch = true;
          return;
        }

        if (cyr_event.touches.length > 0) {
          return;
        }

        // 全部手指离开：松手时再做一次边界限制
        cyr_rect = cyr_viewer.getBoundingClientRect();
        cyr_clampTranslate();
        cyr_render(false);

        var cyr_touch = cyr_event.changedTouches[0];
        var cyr_isTap = cyr_mode === "pan" && !cyr_moved && !cyr_hadMultiTouch;
        cyr_mode = "none";

        if (!cyr_isTap) {
          cyr_lastTapAt = 0;
          return;
        }

        // 双击判定：两次轻点间隔 < 300ms，且落点偏移 < 30px
        var cyr_now = Date.now();
        var cyr_nearLastTap =
          Math.abs(cyr_touch.clientX - cyr_lastTapX) < cyr_DOUBLE_TAP_RANGE &&
          Math.abs(cyr_touch.clientY - cyr_lastTapY) < cyr_DOUBLE_TAP_RANGE;

        if (cyr_lastTapAt && cyr_now - cyr_lastTapAt < cyr_DOUBLE_TAP_DELAY && cyr_nearLastTap) {
          cyr_lastTapAt = 0;
          cyr_handleDoubleTap(cyr_touch);
        } else {
          cyr_lastTapAt = cyr_now;
          cyr_lastTapX = cyr_touch.clientX;
          cyr_lastTapY = cyr_touch.clientY;
        }
      }

      /**
       * 功能：touchcancel —— 手势被系统打断时复位状态并夹取边界
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @returns {void}
       */
      function cyr_onTouchCancel() {
        cyr_mode = "none";
        cyr_moved = false;
        cyr_lastTapAt = 0;
        if (cyr_rect) {
          cyr_clampTranslate();
          cyr_render(false);
        }
      }

      /**
       * 功能：页面打开时显示"双指缩放请用手机打开"提示，3 秒后淡出
       * 作者：陈禹燃
       * 建立时间：2026-11-16 14:03
       * @returns {void}
       */
      function cyr_showTip() {
        cyr_tip.classList.add("cyr_show");
        setTimeout(function () {
          cyr_tip.classList.remove("cyr_show");
        }, 3000);
      }

      /* ===================== 事件绑定 ===================== */
      cyr_viewer.addEventListener("touchstart", cyr_onTouchStart, { passive: true });
      // touchmove 需要 preventDefault，因此显式声明非 passive
      cyr_viewer.addEventListener("touchmove", cyr_onTouchMove, { passive: false });
      cyr_viewer.addEventListener("touchend", cyr_onTouchEnd, { passive: true });
      cyr_viewer.addEventListener("touchcancel", cyr_onTouchCancel, { passive: true });

      // 双击缩放结束或手势打断后，移除过渡类，避免影响下一次跟手操作
      cyr_image.addEventListener("transitionend", function () {
        cyr_image.classList.remove("cyr_animating");
      });

      /* ===================== 初始化 ===================== */
      cyr_rect = cyr_viewer.getBoundingClientRect();
      cyr_render(false);
      cyr_showTip();
    })();
  </script>
</body>
</html>
